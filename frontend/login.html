<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechMart Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 400px; margin-top: 100px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="text-center mb-4">TechMart Admin Login</h4>

        <div id="message" class="alert d-none"></div>

        <input id="email" type="email" class="form-control mb-3" placeholder="Email">
        <input id="password" type="password" class="form-control mb-3" placeholder="Password">
        <button id="loginBtn" class="btn btn-primary w-100">Login</button>
      </div>
    </div>
  </div>

  <script>
    const message = document.getElementById("message");

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      message.classList.remove("d-none", "alert-success", "alert-danger");

      try {
        const res = await fetch("http://localhost:5000/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok) {
         localStorage.setItem("token", data.token);
localStorage.setItem("adminName", data.name);
window.location.href = "dashboard.html";
        } else {
          message.classList.add("alert-danger");
          message.textContent = data.message;
        }
      } catch (err) {
        message.classList.add("alert-danger");
        message.textContent = "Cannot reach the server";
      }
    });
  </script>
</body>
</html>
