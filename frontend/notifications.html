<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechMart Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="d-flex">
    <nav id="sidebar" class="bg-dark text-white p-3 min-vh-100" style="width: 220px;"></nav>

    <div class="flex-grow-1">
      <header id="topbar" class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center"></header>

      <main class="p-4">
        <div id="message" class="alert d-none"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center">
            <div class="btn-group me-3">
              <button id="allBtn" class="btn btn-sm btn-primary">All</button>
              <button id="unreadBtn" class="btn btn-sm btn-outline-primary">Unread only</button>
            </div>
            <span id="count" class="text-muted"></span>
          </div>
          <button id="readAllBtn" class="btn btn-outline-secondary btn-sm">Mark all as read</button>
        </div>

        <div class="card shadow-sm">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Time</th>
                <th>Type</th>
                <th>Message</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderLayout("notifications", "Notifications");

    const tableBody = document.getElementById("tableBody");
    const allBtn = document.getElementById("allBtn");
    const unreadBtn = document.getElementById("unreadBtn");

    let unreadOnly = false;

    const TYPE = {
      new_order: { label: "New order", cls: "bg-primary" },
      low_stock: { label: "Low stock", cls: "bg-danger" },
    };

    function showMessage(text, type) {
      const box = document.getElementById("message");
      box.className = "alert alert-" + type;
      box.textContent = text;
    }

    function addCell(row, text) {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.appendChild(cell);
      return cell;
    }

    function setFilter(onlyUnread) {
      unreadOnly = onlyUnread;
      allBtn.className = "btn btn-sm " + (onlyUnread ? "btn-outline-primary" : "btn-primary");
      unreadBtn.className = "btn btn-sm " + (onlyUnread ? "btn-primary" : "btn-outline-primary");
      loadNotifications();
    }

    async function markRead(n) {
      try {
        await api("/notifications/" + n._id + "/read", { method: "PUT" });
        loadNotifications();
      } catch (err) {
        showMessage(err.message, "danger");
      }
    }

    async function markAllRead() {
      try {
        const data = await api("/notifications/read-all", { method: "PUT" });
        showMessage(data.changed + " alerts marked as read", "success");
        loadNotifications();
      } catch (err) {
        showMessage(err.message, "danger");
      }
    }

    async function loadNotifications() {
      try {
        const data = await api("/notifications" + (unreadOnly ? "?unread=true" : ""));
        document.getElementById("count").textContent =
          data.count + (unreadOnly ? " unread alerts" : " alerts");
        tableBody.innerHTML = "";

        if (data.notifications.length === 0) {
          tableBody.innerHTML =
            '<tr><td colspan="4" class="text-center text-muted">' +
            (unreadOnly ? "No unread alerts" : "No alerts yet") + "</td></tr>";
          return;
        }

        data.notifications.forEach((n) => {
          const row = document.createElement("tr");

          addCell(row, new Date(n.createdAt).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }));

          const typeCell = addCell(row, "");
          const badge = document.createElement("span");
          badge.className = "badge " + TYPE[n.type].cls;
          badge.textContent = TYPE[n.type].label;
          typeCell.appendChild(badge);

          const messageCell = addCell(row, n.message);
          if (!n.isRead) {
            messageCell.className = "fw-bold";
          }

          const actionCell = addCell(row, "");
          if (n.isRead) {
            actionCell.textContent = "Read";
            actionCell.className = "text-muted";
          } else {
            const button = document.createElement("button");
            button.className = "btn btn-sm btn-outline-primary";
            button.textContent = "Mark read";
            button.addEventListener("click", () => markRead(n));
            actionCell.appendChild(button);
          }

          tableBody.appendChild(row);
        });
      } catch (err) {
        showMessage(err.message, "danger");
      }
    }

    allBtn.addEventListener("click", () => setFilter(false));
    unreadBtn.addEventListener("click", () => setFilter(true));
    document.getElementById("readAllBtn").addEventListener("click", markAllRead);

    loadNotifications();
  </script>
</body>
</html>
