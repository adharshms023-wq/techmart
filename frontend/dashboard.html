<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechMart Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="d-flex">
    <nav id="sidebar" class="bg-dark text-white p-3 min-vh-100" style="width: 220px;"></nav>

    <div class="flex-grow-1">
      <header id="topbar" class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center"></header>

      <main class="p-4">
        <div id="error" class="alert alert-danger d-none"></div>

        <div class="row g-3">
          <div class="col-md-3">
            <div class="card shadow-sm"><div class="card-body">
              <div class="text-muted small">Total revenue</div>
              <div class="fs-4 fw-bold" id="revenue">-</div>
            </div></div>
          </div>
          <div class="col-md-3">
            <div class="card shadow-sm"><div class="card-body">
              <div class="text-muted small">Orders</div>
              <div class="fs-4 fw-bold" id="orders">-</div>
            </div></div>
          </div>
          <div class="col-md-3">
            <div class="card shadow-sm"><div class="card-body">
              <div class="text-muted small">Products</div>
              <div class="fs-4 fw-bold" id="products">-</div>
            </div></div>
          </div>
          <div class="col-md-3">
            <div class="card shadow-sm"><div class="card-body">
              <div class="text-muted small">Low-stock products</div>
              <div class="fs-4 fw-bold text-danger" id="lowStock">-</div>
            </div></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireLogin();
    renderLayout("dashboard", "Dashboard");

    async function loadSummary() {
      try {
        const s = await api("/reports/summary");
        document.getElementById("revenue").textContent = "Rs " + s.totalRevenue.toLocaleString("en-IN");
        document.getElementById("orders").textContent = s.totalOrders;
        document.getElementById("products").textContent = s.totalProducts;
        document.getElementById("lowStock").textContent = s.lowStockCount;
      } catch (err) {
        const box = document.getElementById("error");
        box.textContent = err.message;
        box.classList.remove("d-none");
      }
    }

    loadSummary();
  </script>
</body>
</html>
